<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Briefolio 로그인</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
        background: #05070a;
        color: #f5f5f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 78% 16%, rgba(48, 209, 88, 0.18), transparent 30%),
          radial-gradient(circle at 18% 84%, rgba(100, 210, 255, 0.14), transparent 34%),
          linear-gradient(145deg, #020406 0%, #080d12 48%, #141416 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: -12% -8%;
        background:
          linear-gradient(115deg, transparent 0 26%, rgba(100,210,255,0.18) 26.4%, transparent 27.1% 54%, rgba(48,209,88,0.18) 54.4%, transparent 55.2%),
          repeating-linear-gradient(0deg, rgba(255,255,255,0.045) 0 1px, transparent 1px 128px);
        opacity: 0.74;
        filter: blur(1px);
        transform: rotate(-2deg);
      }

      .shade {
        position: fixed;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(5,7,10,0.94), rgba(5,7,10,0.46), rgba(5,7,10,0.84)),
          linear-gradient(180deg, rgba(5,7,10,0.14), rgba(5,7,10,0.92));
      }

      .wrap {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(1180px, calc(100% - 40px));
        margin: 28px auto 0;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: #fff;
        font-weight: 850;
      }

      .mark {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: #fff;
        color: #071017;
        font-weight: 950;
        box-shadow: 0 16px 38px rgba(0,0,0,0.28);
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 430px);
        align-items: center;
        gap: clamp(30px, 6vw, 86px);
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        padding: 42px 0 86px;
      }

      .copy p {
        margin: 0 0 16px;
        color: #7df2a2;
        font-size: 13px;
        font-weight: 850;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        color: #fff;
        font-size: clamp(46px, 6vw, 78px);
        font-weight: 300;
        line-height: 1.04;
        letter-spacing: 0;
        text-shadow: 0 18px 52px rgba(0,0,0,0.46);
      }

      .copy small {
        display: block;
        max-width: 560px;
        margin-top: 22px;
        color: rgba(245,245,247,0.72);
        font-size: 18px;
        line-height: 1.7;
      }

      .card {
        display: grid;
        gap: 18px;
        padding: 26px;
        border: 1px solid rgba(255,255,255,0.32);
        border-top-color: rgba(255,255,255,0.5);
        border-radius: 28px;
        background:
          linear-gradient(145deg, rgba(44,44,46,0.82), rgba(18,18,20,0.72)),
          radial-gradient(circle at 12% 0%, rgba(255,255,255,0.18), transparent 36%);
        backdrop-filter: blur(22px) saturate(180%);
        -webkit-backdrop-filter: blur(22px) saturate(180%);
        box-shadow:
          inset 1px 1px 2px rgba(255,255,255,0.22),
          inset -1px -1px 2px rgba(0,0,0,0.22),
          0 26px 72px rgba(0,0,0,0.32);
      }

      .card-head {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .card-head strong,
      .card-head span {
        display: block;
      }

      .card-head strong {
        font-size: 22px;
      }

      .card-head span {
        margin-top: 3px;
        color: rgba(235,235,245,0.62);
        font-size: 13px;
        font-weight: 700;
      }

      label {
        display: grid;
        gap: 8px;
        color: rgba(245,245,247,0.72);
        font-size: 13px;
        font-weight: 800;
      }

      input {
        width: 100%;
        min-height: 58px;
        border: 1px solid rgba(235,235,245,0.18);
        border-radius: 18px;
        padding: 0 18px;
        background: rgba(255,255,255,0.08);
        color: #fff;
        font-size: 18px;
        font-weight: 760;
        outline: none;
        box-shadow: inset 1px 1px 2px rgba(255,255,255,0.08);
      }

      input:focus {
        border-color: rgba(48,209,88,0.72);
        box-shadow: 0 0 0 4px rgba(48,209,88,0.14);
      }

      button {
        min-height: 58px;
        border: 0;
        border-radius: 18px;
        background: #30d158;
        color: #06120a;
        font-size: 16px;
        font-weight: 900;
        cursor: pointer;
        box-shadow:
          inset 1px 1px 2px rgba(255,255,255,0.35),
          0 18px 46px rgba(0,0,0,0.24);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .status {
        min-height: 22px;
        margin: 0;
        color: rgba(245,245,247,0.68);
        font-size: 13px;
        line-height: 1.55;
      }

      .status.error {
        color: #ff6961;
      }

      @media (max-width: 820px) {
        body {
          overflow: auto;
        }

        header {
          width: min(100% - 32px, 1180px);
          margin-top: 22px;
        }

        main {
          grid-template-columns: 1fr;
          width: min(100% - 32px, 1180px);
          padding: 46px 0 70px;
        }

        h1 {
          font-size: 42px;
        }

        .copy small {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shade"></div>
    <div class="wrap">
      <header>
        <div class="brand">
          <span class="mark">B</span>
          <span>Briefolio</span>
        </div>
      </header>

      <main>
        <section class="copy">
          <p>Private Access</p>
          <h1>내 포트폴리오만 조용히 열기</h1>
          <small>외부 회원가입 없이 Cloudflare 환경변수에 저장한 개인 PIN으로만 접속합니다.</small>
        </section>

        <form class="card" id="loginForm">
          <div class="card-head">
            <span class="mark">B</span>
            <div>
              <strong>Briefolio</strong>
              <span>Personal Portfolio Gate</span>
            </div>
          </div>
          <label>
            개인 PIN
            <input id="pinInput" name="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Cloudflare APP_PIN 입력" autofocus>
          </label>
          <button id="submitButton" type="submit">내 앱 열기</button>
          <p id="status" class="status">Cloudflare에 설정한 APP_PIN으로 로그인합니다.</p>
        </form>
      </main>
    </div>

    <script>
      const form = document.querySelector("#loginForm");
      const input = document.querySelector("#pinInput");
      const button = document.querySelector("#submitButton");
      const status = document.querySelector("#status");
      const params = new URLSearchParams(location.search);
      const next = params.get("next") || "/";

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.classList.toggle("error", isError);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const pin = input.value.trim();
        if (!pin) {
          setStatus("PIN을 입력하세요.", true);
          input.focus();
          return;
        }
        button.disabled = true;
        setStatus("확인 중입니다.");
        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ pin }),
          });
          if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            throw new Error(data.error || "로그인에 실패했습니다.");
          }
          location.href = next.startsWith("/") ? next : "/";
        } catch (error) {
          button.disabled = false;
          setStatus(error.message, true);
        }
      });
    </script>
  </body>
</html>
