name: Daily portfolio briefing

on:
  schedule:
    # GitHub Actions can delay jobs at the top of the hour.
    # 06:45 Asia/Seoul is 21:45 UTC on the previous day.
    - cron: "45 21 * * *"
  workflow_dispatch:

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send briefing email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEFING_RECIPIENT: ${{ secrets.BRIEFING_RECIPIENT }}
          PORTFOLIO_CONFIG_URL: ${{ secrets.PORTFOLIO_CONFIG_URL }}
        run: python scripts/portfolio_briefing_email.py
